<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác minh Vượt Link</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .status { margin-top: 15px; font-weight: 600; font-size: 15px; color: #334155; line-height: 1.5; }
    .error { color: #ef4444; }
    .success { color: #10b981; }
  </style>
</head>
<body>

  <div class="card">
    <h3 id="title">⏳ Đang xác minh...</h3>
    <div id="loader" class="loader"></div>
    <div id="status" class="status">Hệ thống đang kiểm tra địa chỉ IP và Proxy/VPN...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const initData = tg.initData;
    const taskId = tg.initDataUnsafe?.start_param;

    // THAY ĐƯỜNG DẪN BACKEND CỦA BẠN VÀO ĐÂY
    const BACKEND_URL = "https://your-backend-domain.com/api/verify-task";

    async function processVerification() {
      const statusDiv = document.getElementById('status');
      const loader = document.getElementById('loader');
      const title = document.getElementById('title');

      if (!taskId) {
        loader.style.display = 'none';
        title.innerText = "❌ Lỗi Nhiệm Vụ";
        statusDiv.innerHTML = "<span class='error'>Không tìm thấy mã nhiệm vụ! Vui lòng làm lại từ Bot Telegram.</span>";
        return;
      }

      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData, taskId })
        });

        const data = await response.json();
        loader.style.display = 'none';

        if (data.success) {
          title.innerText = "🎉 Thành Công!";
          statusDiv.innerHTML = `<span class='success'>${data.message}</span><br><br><small style='color:#64748b'>Đang tự động chuyển về Bot...</small>`;
          
          // Tự đóng Mini App để về khung Chat Bot sau 1.5 giây
          setTimeout(() => {
            tg.close();
          }, 1500);
        } else {
          title.innerText = "🚫 Xác Minh Thất Bại";
          statusDiv.innerHTML = `<span class='error'>${data.message}</span>`;
        }
      } catch (err) {
        loader.style.display = 'none';
        title.innerText = "❌ Lỗi Kết Nối";
        statusDiv.innerHTML = "<span class='error'>Không thể kết nối tới máy chủ xác minh.</span>";
      }
    }

    processVerification();
  </script>
</body>
</html>
